<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <title>Updating Cat Trainer…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf2;color:#173467;font-family:system-ui,sans-serif;text-align:center;padding:24px}
    main{max-width:360px}h1{margin:0 0 10px;font-size:1.6rem}p{line-height:1.45;color:#51627e}.paw{font-size:3rem;animation:bounce .8s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-8px)}}
  </style>
</head>
<body>
  <main><div class="paw">🐾</div><h1>Updating Cat Trainer</h1><p>Loading the repaired illustrated version…</p></main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(item=>item.scope.includes('/School/cat-trainer/')).map(item=>item.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.startsWith('cat-trainer')).map(key=>caches.delete(key)));
        }
      }catch(error){console.warn('Cat Trainer refresh cleanup was incomplete.',error)}
      location.replace('./?build=42-fixed');
    })();
  </script>
</body>
</html>
