<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repairing Cat Trainer</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#fffaf2;color:#173b70;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    main{max-width:360px;background:white;border:2px dashed #b9a8dc;border-radius:28px;padding:28px;box-shadow:0 12px 30px #3b2a1814}
    h1{margin:0 0 12px}p{line-height:1.5;margin:0}
  </style>
</head>
<body>
  <main><h1>Repairing Cat Trainer…</h1><p>Removing the broken program cache, then reopening the stable app.</p></main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(r=>r.scope.includes('/cat-trainer/')).map(r=>r.unregister()));
        }
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('cat-trainer-')).map(k=>caches.delete(k)));
      }catch(error){console.warn(error)}
      location.replace('./?v=44&stable=1');
    })();
  </script>
</body>
</html>
