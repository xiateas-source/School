<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Resetting Cat Trainer</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#fffaf2;color:#173b70;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    main{max-width:380px;background:#fff;border:2px solid #b9a8dc;border-radius:28px;padding:28px;box-shadow:0 12px 30px #3b2a1814}
    h1{margin:0 0 12px}p{line-height:1.5;margin:0}
  </style>
</head>
<body>
  <main><h1>Resetting Cat Trainer…</h1><p>This page is outside the app’s service-worker scope, so the old broken cache cannot intercept it.</p></main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.includes('cat-trainer')).map(key=>caches.delete(key)));
        }
      }catch(error){console.warn('Cat Trainer reset warning:',error)}
      location.replace('./cat-trainer/?v=45&reset=outside-scope');
    })();
  </script>
</body>
</html>
